services:
  postgres:
    image: postgres:16-alpine
    container_name: ois-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ois
      POSTGRES_PASSWORD: ois_dev_password
      POSTGRES_DB: ois
    ports:
      - "${PG_HOST_PORT:-5439}:5432"
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=15000
      - -c
      - lock_timeout=5000
      - -c
      - statement_timeout=10000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - max_connections=100
    volumes:
      - ois_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ois -d ois"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ois-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://ois:ois_dev_password@postgres:5432/ois
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    image: ois-api:local
    container_name: ois-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ois:ois_dev_password@postgres:5432/ois
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      PG_POOL_MAX_WAITING: ${PG_POOL_MAX_WAITING:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    mem_limit: 512m

volumes:
  ois_pgdata:
