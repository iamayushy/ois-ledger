substitutions:
  _REGION: asia-south2
  _AR_REPO: ois
  _SERVICE: ois-api
  _MIGRATE_JOB: ois-migrate
  _DB_SECRET: ois-database-url
  _CORS_ORIGIN: http://localhost:5173
  _MAX_INSTANCES: "4"
  _PG_POOL_MAX: "20"
  _PG_POOL_MAX_WAITING: "100"
  _LOG_LEVEL: info

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --file=Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATE_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --command=node
      - --args=--enable-source-maps,dist/migrate.mjs
      - --set-secrets=DATABASE_URL=${_DB_SECRET}:latest
      - --set-env-vars=DOTENV_CONFIG_QUIET=true
      - --tasks=1
      - --max-retries=0
      - --task-timeout=300
      - --execute-now
      - --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --port=3001
      - --allow-unauthenticated
      - --max-instances=${_MAX_INSTANCES}
      - --set-secrets=DATABASE_URL=${_DB_SECRET}:latest
      - --set-env-vars=CORS_ORIGIN=${_CORS_ORIGIN},PG_POOL_MAX=${_PG_POOL_MAX},PG_POOL_MAX_WAITING=${_PG_POOL_MAX_WAITING},LOG_LEVEL=${_LOG_LEVEL}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
