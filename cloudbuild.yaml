substitutions:
  _REGION: asia-south1
  _AR_REPO: ois
  _SERVICE: ois-ledger
  _DB_SECRET: ois_db_url
  _PROXY_SECRET: ois_proxy_secret
  _CORS_ORIGIN: https://order.atlair.cloud
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "4"
  _PG_POOL_MAX: "10"
  _PG_POOL_MAX_WAITING: "250"
  _CONCURRENCY: "250"
  _LOG_LEVEL: info

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --file=Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --port=3001
      - --no-invoker-iam-check
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu-boost
      - --concurrency=${_CONCURRENCY}
      - --startup-probe=httpGet.path=/health/ready,httpGet.port=3001,timeoutSeconds=3,periodSeconds=5,failureThreshold=12
      - --readiness-probe=httpGet.path=/health/ready,httpGet.port=3001,timeoutSeconds=3,periodSeconds=10,failureThreshold=3,successThreshold=1
      - --liveness-probe=httpGet.path=/health/live,httpGet.port=3001,timeoutSeconds=2,periodSeconds=15,failureThreshold=3
      - --set-secrets=DATABASE_URL=${_DB_SECRET}:latest,PROXY_SHARED_SECRET=${_PROXY_SECRET}:latest
      - --set-env-vars=CORS_ORIGIN=${_CORS_ORIGIN},PG_POOL_MAX=${_PG_POOL_MAX},PG_POOL_MAX_WAITING=${_PG_POOL_MAX_WAITING},LOG_LEVEL=${_LOG_LEVEL}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
